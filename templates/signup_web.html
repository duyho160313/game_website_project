<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Information</title>
<style>
:root{--bg:#f5f6f7;--card:#fff;--ink:#1c2428;--line:#cfd6da;--accent:#1f6f5c;--accent-ink:#fff;--code:#eef1f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121719;--card:#1b2225;--ink:#e6ecee;--line:#334047;--accent:#4fc3a1;--accent-ink:#06211a;--code:#10161a}}
:root[data-theme="dark"]{--bg:#121719;--card:#1b2225;--ink:#e6ecee;--line:#334047;--accent:#4fc3a1;--accent-ink:#06211a;--code:#10161a}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
h1{font-size:1.3rem;margin:0 0 16px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:9px 10px}
input:focus-visible,button:focus-visible,.home-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:20px}
button{flex:1;font:inherit;font-weight:600;padding:10px;border-radius:6px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink)}
pre{margin:0;padding:12px;background:var(--code);border-radius:6px;overflow-x:auto;font-size:.88rem}
.home-container{display:flex;justify-content:center;margin-top:20px}
.home-btn{display:inline-block;font:inherit;font-weight:600;padding:10px 20px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;cursor:pointer}
.home-btn:hover{background:var(--accent);color:var(--accent-ink)}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <form id="form">
    <h1>Student Information</h1>
    <label for="name">Name</label>
    <input id="name" required>
    <label for="dob">Date of birth</label>
    <input id="dob" type="date" required>
    <label for="email">Email</label>
    <input id="email" type="email" required>
    <label for="cls">Class</label>
    <input id="cls" required>
    <label for="school">School</label>
    <input id="school" required>
    <div class="row">
      <button type="submit" class="primary">Submit</button>
      <button type="reset">Cancel</button>
    </div>
  </form>

  <div id="result" hidden>
    <h1>Submitted data</h1>
    <pre id="json"></pre>
    <div class="row"><button type="button" id="back">Back</button></div>
  </div>

  <div class="home-container">
    <a class="home-btn" href="{{ url_for('home') }}">Go Back To Home Screen</a>
  </div>
</main>
<script>
var form=document.getElementById('form'),result=document.getElementById('result');
form.addEventListener('submit',function(e){
  e.preventDefault();
  var data={
    name:document.getElementById('name').value.trim(),
    dateOfBirth:document.getElementById('dob').value,
    email:document.getElementById('email').value.trim(),
    class:document.getElementById('cls').value.trim(),
    school:document.getElementById('school').value.trim()
  };
  document.getElementById('json').textContent=JSON.stringify(data,null,2);
  form.hidden=true;result.hidden=false;
});
document.getElementById('back').addEventListener('click',function(){
  result.hidden=true;form.hidden=false;
});
</script>
</body>
</html>
