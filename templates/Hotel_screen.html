<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Booking</title>
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/Hotel_screen.css') }}">
</head>

<body>

<div class="container">

    <!-- Frame 1 -->
    <div class="welcome-box">
        <h1>Welcome to Paradise Hotel</h1>
    </div>

    <!-- Frame 2 -->
    <div class="rooms-section">

        <div class="rooms">

            <div class="room-card">
                <div class="room-image"
                    style="background-image:url('https://images.unsplash.com/photo-1566073771259-6a8506099945');">
                </div>
                <div class="room-title">Standard Room</div>
                <div class="room-price">$120 / Night</div>
                <button class="book-btn" onclick="bookRoom('Standard Room')">
                    Book Room
                </button>
            </div>

            <div class="room-card">
                <div class="room-image"
                    style="background-image:url('https://images.unsplash.com/photo-1582719508461-905c673771fd');">
                </div>
                <div class="room-title">Deluxe Room</div>
                <div class="room-price">$220 / Night</div>
                <button class="book-btn" onclick="bookRoom('Deluxe Room')">
                    Book Room
                </button>
            </div>

            <div class="room-card">
                <div class="room-image"
                    style="background-image:url('https://images.unsplash.com/photo-1578683010236-d716f9a3f461');">
                </div>
                <div class="room-title">Luxury Suite</div>
                <div class="room-price">$350 / Night</div>
                <button class="book-btn" onclick="bookRoom('Luxury Suite')">
                    Book Room
                </button>
            </div>

            <div class="room-card">
                <div class="room-image"
                    style="background-image:url('https://images.unsplash.com/photo-1445019980597-93fa8acb246c');">
                </div>
                <div class="room-title">Family Room</div>
                <div class="room-price">$280 / Night</div>
                <button class="book-btn" onclick="bookRoom('Family Room')">
                    Book Room
                </button>
            </div>

        </div>

        <div class="home-container">
            <a class="home-btn" href="{{ url_for('home') }}">Go Back To Home Screen</a>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='JS/Hotel.js') }}"></script>

</body>
</html>
